services:
  # Backend Web Service (SQLite - No external database needed)
  - type: web
    name: telemedicine-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python app_sqlite.py
    envVars:
      - key: PORT
        value: 5000
    plan: free

  # Frontend Static Site
  - type: site
    name: telemedicine-frontend
    buildCommand: ""
    publishDir: frontend
    envVars:
      - key: API_URL
        value: https://telemedicine-backend.onrender.com/api
    plan: free
